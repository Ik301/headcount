name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (no torch)
        run: pip install numpy polars pyarrow scikit-learn joblib matplotlib datasketch httpx python-dotenv pytest
      - name: Run tests
        run: python -m pytest -q tests
