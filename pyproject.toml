[project]
name = "socialnet-bot-tracker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "datasketch>=1.6",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[tool.uv]
# CPU-only torch keeps installs small
index-strategy = "unsafe-best-match"
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.setuptools]
packages = []
